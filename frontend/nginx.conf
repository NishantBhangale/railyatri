server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container over the Docker network.
    # This is what lets the frontend use a relative "/api" path (no
    # VITE_API_URL needed) even though it's running in its own container —
    # Nginx resolves "backend" via Docker's internal DNS; the browser never
    # needs to know that hostname exists.
    location /api/ {
        proxy_pass http://railyatri-backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — any non-file, non-/api route serves index.html so
    # client-side routing (if added later) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
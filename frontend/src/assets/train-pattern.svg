    <rect x="18" y="30" width="70" height="26" rx="6" />
    <rect x="26" y="16" width="34" height="18" rx="4" />
    <rect x="30" y="20" width="8" height="8" rx="1" fill="#0B1120" />
    <rect x="42" y="20" width="8" height="8" rx="1" fill="#0B1120" />
